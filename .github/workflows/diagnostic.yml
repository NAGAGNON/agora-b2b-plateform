name: Diagnostic production
on:
  push:
    branches: [claude/zealous-archimedes-ui0kph]
    paths: [.github/workflows/diagnostic.yml]
jobs:
  sante:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://www.linkprob2b.com
          for i in $(seq 1 30); do
            v=$(curl -sS -m 20 $B/api/sante | grep -o '"version":"[^"]*"'); echo "$v"
            echo "$v" | grep -q 9839284 && break; sleep 20
          done
          echo "=== Bing"; curl -sS -m 20 -w "\nHTTP %{http_code} %{content_type}\n" $B/BingSiteAuth.xml
          curl -sS -m 20 $B/ | grep -o '<meta name="msvalidate.01"[^>]*>'
          echo "=== IndexNow"; curl -sS -m 20 -w " HTTP %{http_code}\n" $B/indexnow.txt | sed -E 's/[a-f0-9]{32}/<cle 32 hex>/'
          echo "=== analyses"; curl -sS -m 20 -o /dev/null -w "HTTP %{http_code}\n" $B/analyses
          echo "=== jsonld"; curl -sS -m 20 $B/faq | grep -o '"@type":"[A-Za-z]*"' | sort -u
