name: Diagnostic production
on:
  push:
    branches: [claude/zealous-archimedes-ui0kph]
    paths: [.github/workflows/diagnostic.yml]
jobs:
  sante:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://www.linkprob2b.com
          curl -sS -m 20 $B/api/sante; echo
          curl -sS -m 30 $B/analyses > a.html
          links=$(grep -o 'href="/analyses/[^"]*"' a.html | sort -u | sed 's/href="//;s/"//')
          echo "=== articles publiés:"; echo "$links"
          for l in $(echo "$links" | head -3); do
            echo; echo "################ $l"
            curl -sS -m 30 "$B$l" > p.html
            grep -o '"@type":"[A-Za-z]*"' p.html | sort -u | tr '\n' ' '; echo
            python3 - <<'PY'
          import re,html
          s=open("p.html",encoding="utf-8").read()
          m=re.search(r'<main[^>]*>(.*)</main>',s,re.S)
          t=re.sub(r'<script.*?</script>','',m.group(1) if m else s,flags=re.S)
          t=re.sub(r'<(h1|h2|h3|p|li)[^>]*>',r'\n[\1] ',t)
          t=html.unescape(re.sub(r'<[^>]+>','',t))
          print(re.sub(r'\n\s*\n+','\n',t)[:6000])
          PY
          done
